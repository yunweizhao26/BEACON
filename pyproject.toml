[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.0.0"
description = "Prior-guided regulatory pair prioritization from single-cell expression"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["."]
include = ["beacon*", "experiments*", "evaluation*", "figures*", "preparation*", "data*", "tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["dependencies.txt"]}
